<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Pagos - Búho Electronics</title>
    <!-- Importación de Tipografía Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --turquesa-principal: #19D3D3;
            --turquesa-secundario: #24C7C7;
            --azul-oscuro: #1C2430;
            --gris-claro: #EAEAEA;
            --card-bg: #FFFFFF;
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            padding: 24px 16px; 
            max-width: 460px; 
            margin: auto; 
            background-color: var(--gris-claro);
            color: var(--azul-oscuro);
        }

        .card { 
            background: var(--card-bg); 
            padding: 28px 24px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px -5px rgba(28, 36, 48, 0.08);
            border: 1px solid rgba(28, 36, 48, 0.05);
        }

        h2 { 
            margin: 0 0 20px 0; 
            color: var(--azul-oscuro); 
            font-size: 20px; 
            font-weight: 700;
            text-align: center; 
            letter-spacing: -0.3px;
        }

        label { 
            font-weight: 600; 
            display: block; 
            margin-top: 16px; 
            color: var(--azul-oscuro); 
            font-size: 13px; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select, button { 
            width: 100%; 
            padding: 12px 14px; 
            margin-top: 6px; 
            border-radius: 8px; 
            border: 1px solid #d1d5db; 
            box-sizing: border-box; 
            font-family: 'Poppins', sans-serif;
            font-size: 14px; 
            outline: none;
            transition: all 0.2s ease;
            color: var(--azul-oscuro);
        }

        input:focus, select:focus {
            border-color: var(--turquesa-principal);
            box-shadow: 0 0 0 3px rgba(25, 211, 211, 0.25);
        }

        .tasa-container { 
            display: flex; 
            gap: 10px; 
            align-items: center; 
        }

        .btn-refresh { 
            width: auto; 
            margin-top: 6px; 
            padding: 12px 16px; 
            background-color: var(--gris-claro); 
            color: var(--azul-oscuro);
            border: 1px solid #d1d5db;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .btn-refresh:hover {
            background-color: #dcdcdc;
        }

        .preview { 
            background: #f0fdfd; 
            padding: 18px; 
            border-left: 4px solid var(--turquesa-principal); 
            margin-top: 24px; 
            border-radius: 8px; 
        }

        .preview strong { 
            color: var(--azul-oscuro); 
            font-size: 12px; 
            font-weight: 700;
            text-transform: uppercase; 
            letter-spacing: 0.8px; 
        }

        .preview p { 
            font-size: 14px; 
            font-weight: 600; 
            margin: 10px 0 14px 0; 
            color: var(--azul-oscuro); 
            word-break: break-word; 
            line-height: 1.5;
        }

        #btnCopy {
            background-color: var(--turquesa-principal); 
            color: var(--azul-oscuro); 
            font-weight: 700; 
            border: none; 
            margin-top: 0; 
            cursor: pointer; 
            border-radius: 8px;
            padding: 12px;
        }

        #btnCopy:hover { 
            background-color: var(--turquesa-secundario); 
        }
    </style>
</head>
<body>

<div class="card">
    <h2>💳 Generador de Notas</h2>

    <label>Tasa BCV (Bs. S):</label>
    <div class="tasa-container">
        <input type="number" step="0.01" id="tasaInput" placeholder="Cargando..." oninput="calcularNota()">
        <button type="button" class="btn-refresh" onclick="obtenerTasa()" title="Actualizar Tasa">🔄</button>
    </div>

    <label>Monto Total ($ USD):</label>
    <input type="number" step="0.01" id="totalUSD" placeholder="0.00" oninput="calcularNota()">

    <label>Método de Pago:</label>
    <select id="paymentMethod" onchange="toggleCampos(); calcularNota();">
        <option value="pago_movil">Pago Móvil (BCV)</option>
        <option value="cuotas">Pago en Cuotas</option>
        <option value="divisas">Divisas (Efectivo)</option>
    </select>

    <!-- Campos Dinámicos -->
    <div id="campoDivisas" style="display:none;">
        <label>¿Con cuánto cancela el cliente ($)?</label>
        <input type="number" id="billete" placeholder="0.00" oninput="calcularNota()">
    </div>

    <div id="campoCuotas" style="display:none;">
        <label>Número de cuotas restantes:</label>
        <input type="number" id="numCuotas" value="1" oninput="calcularNota()">
    </div>

    <div class="preview">
        <strong>Nota generada:</strong>
        <p id="previewText">Ingresa los datos del pedido...</p>
        <button type="button" id="btnCopy" onclick="copiarTexto()">📋 Copiar Texto</button>
    </div>
</div>

<script>
async function obtenerTasa() {
    const tasaInput = document.getElementById('tasaInput');
    tasaInput.placeholder = "Buscando...";

    try {
        const res = await fetch('https://pydolarve.org/api/v1/dollar?page=bcv');
        const data = await res.json();
        if (data && data.monedas && data.monedas.usd) {
            tasaInput.value = data.monedas.usd.promedio;
            calcularNota();
            return;
        }
    } catch (e) {
        console.warn("Falló PyDolarVe, intentando API secundaria...");
    }

    try {
        const res = await fetch('https://ve.dolarapi.com/v1/dolares/oficial');
        const data = await res.json();
        if (data && data.promedio) {
            tasaInput.value = data.promedio;
            calcularNota();
            return;
        }
    } catch (e) {
        console.warn("Falló DolarApi.");
    }

    tasaInput.placeholder = "Ingresa tasa a mano";
}

function toggleCampos() {
    const metodo = document.getElementById('paymentMethod').value;
    document.getElementById('campoDivisas').style.display = metodo === 'divisas' ? 'block' : 'none';
    document.getElementById('campoCuotas').style.display = metodo === 'cuotas' ? 'block' : 'none';
}

function calcularNota() {
    const usd = parseFloat(document.getElementById('totalUSD').value) || 0;
    const tasaBCV = parseFloat(document.getElementById('tasaInput').value) || 0;
    const metodo = document.getElementById('paymentMethod').value;
    let nota = "";

    if (metodo === 'pago_movil') {
        const totalBs = (usd * tasaBCV).toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const tasaFormateada = tasaBCV.toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        nota = `Pago móvil | Tasa BCV USD (Bs. S ${tasaFormateada}) | Total: Bs. S ${totalBs}`;
    } 
    else if (metodo === 'cuotas') {
        const inicial = (usd * 0.5).toFixed(2);
        const restante = usd - inicial;
        const numCuotas = parseInt(document.getElementById('numCuotas').value) || 1;
        const montoCuota = (restante / numCuotas).toFixed(2);
        
        const fecha = new Date();
        fecha.setDate(fecha.getDate() + 15);
        const fechaTxt = `${fecha.getDate()} ${fecha.toLocaleString('es-ES', { month: 'short' }).toUpperCase()} ${fecha.getFullYear()}`;
        
        nota = `Pago en cuotas | Inicial $${inicial} | Resta ${numCuotas} cuota(s) de $${montoCuota} | 1era cuota (${fechaTxt})`;
    } 
    else if (metodo === 'divisas') {
        const billete = parseFloat(document.getElementById('billete').value) || 0;
        const vuelto = (billete - usd).toFixed(2);
        nota = `Paga ($${billete.toFixed(2)}) en divisas | Enviar ($${vuelto}) de cambio.`;
    }

    document.getElementById('previewText').innerText = nota;
    return nota;
}

async function copiarTexto() {
    const texto = document.getElementById('previewText').innerText;
    const btn = document.getElementById('btnCopy');
    try {
        await navigator.clipboard.writeText(texto);
        btn.innerText = "✅ ¡Copiado!";
        btn.style.backgroundColor = "#24C7C7";
        setTimeout(() => { 
            btn.innerText = "📋 Copiar Texto"; 
            btn.style.backgroundColor = "var(--turquesa-principal)";
        }, 2000);
    } catch (err) {
        alert("Error al copiar el texto.");
    }
}

obtenerTasa();
</script>
</body>
</html>
